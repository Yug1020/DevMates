<script>
        // Simple password strength interaction simulation
        const passwordInput = document.getElementById('password');
        const strengthBars = document.querySelectorAll('.flex.gap-unit > div > div');
        const strengthText = document.querySelector('.text-\\[10px\\]');
        
        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            
            if (val.length > 0) strength++;
            if (val.length > 5) strength++;
            if (val.match(/[0-9]/) && val.match(/[A-Z]/)) strength++;
            if (val.length > 8 && val.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBars.forEach((bar, index) => {
                bar.className = 'h-full transition-all duration-300 w-full ';
                if (index < strength) {
                    if (strength === 1) bar.className += 'bg-error';
                    else if (strength === 2) bar.className += 'bg-tertiary-container';
                    else if (strength === 3) bar.className += 'bg-secondary';
                    else bar.className += 'bg-primary';
                } else {
                    bar.className += 'bg-transparent w-0';
                }
            });
            
            if (strength === 0) { strengthText.textContent = ''; }
            else if (strength === 1) { strengthText.textContent = 'Weak'; strengthText.className = 'font-mono-label text-[10px] mt-unit text-right text-error'; }
            else if (strength === 2) { strengthText.textContent = 'Fair'; strengthText.className = 'font-mono-label text-[10px] mt-unit text-right text-tertiary-container'; }
            else if (strength === 3) { strengthText.textContent = 'Good'; strengthText.className = 'font-mono-label text-[10px] mt-unit text-right text-secondary'; }
            else { strengthText.textContent = 'Strong'; strengthText.className = 'font-mono-label text-[10px] mt-unit text-right text-primary'; }
        });
    </script>
