<style>

<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center p-md md:p-margin-desktop font-body-md antialiased selection:bg-primary-container/30 selection:text-primary">
<!-- Main Onboarding Container -->
<main class="w-full max-w-[720px] bg-surface-container border border-surface-variant rounded-xl shadow-none overflow-hidden flex flex-col">
<!-- Header area with Progress -->
<header class="p-lg md:p-xl border-b border-surface-variant bg-surface-container-low flex flex-col gap-lg">
<div class="flex justify-between items-center">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">terminal</span>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">DevMates</h1>
</div>
<div class="font-mono-label text-mono-label text-on-surface-variant bg-surface-container-lowest px-sm py-xs rounded border border-outline-variant">
                    Step 1 / 3
                </div>
</div>
<!-- Progress Bar: Thin, Cyan progress, border track -->
<div class="w-full h-[4px] bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
<div>
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Developer Identity</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Initialize your profile environment. This helps configure your network matchmaking.</p>
</div>
</header>
<!-- Form Content -->
<div class="p-lg md:p-xl space-y-xl bg-surface-container">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Full Name -->
<div class="space-y-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant block" for="fullName">Full_Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-mono-code text-mono-code text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="e.g. Jane Doe" type="text" value="Alex Mercer"/>
</div>
<!-- Username -->
<div class="space-y-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant block" for="username">Username</label>
<div class="flex rounded-DEFAULT overflow-hidden border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors">
<span class="bg-surface-container-low px-md py-sm flex items-center justify-center text-on-surface-variant border-r border-outline-variant font-mono-code text-mono-code select-none">
                            @
                        </span>
<input class="w-full bg-surface-container-lowest border-none px-md py-sm font-mono-code text-mono-code text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0" id="username" placeholder="username" type="text" value="amercer_dev"/>
</div>
</div>
</div>
<!-- Role Dropdown (Styled Custom Wrapper) -->
<div class="space-y-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant block flex justify-between items-end" for="role">
<span>Primary_Role</span>
<span class="text-[10px] text-outline">required</span>
</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm pr-xl font-mono-code text-mono-code text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="role">
<option disabled="" value="">Select role architecture...</option>
<option selected="" value="frontend">Frontend Engineer</option>
<option value="backend">Backend Engineer</option>
<option value="fullstack">Fullstack Developer</option>
<option value="devops">DevOps / SRE</option>
<option value="data">Data Scientist</option>
<option value="mobile">Mobile Developer</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-md pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">unfold_more</span>
</div>
</div>
</div>
<!-- Bio -->
<div class="space-y-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant block" for="bio">Bio_String</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-mono-code text-mono-code text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y" id="bio" placeholder="// Write a brief summary of your technical background..." rows="3"></textarea>
</div>
<!-- Skills Chips Section -->
<div class="space-y-md">
<label class="font-mono-label text-mono-label text-on-surface-variant block border-b border-surface-variant pb-sm">
                    dependencies.install([<span class="text-secondary">Skills</span>])
                </label>
<div class="flex flex-wrap gap-sm" id="skills-container">
<!-- Selected Chips (Success state style: Emerald text, 10% Emerald fill) -->
<button class="skill-chip active inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-primary/30 bg-primary/10 text-primary font-mono-label text-mono-label cursor-pointer hover:bg-primary/20 transition-colors" type="button">
<span>React</span>
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
<button class="skill-chip active inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-primary/30 bg-primary/10 text-primary font-mono-label text-mono-label cursor-pointer hover:bg-primary/20 transition-colors" type="button">
<span>TypeScript</span>
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
<button class="skill-chip active inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-primary/30 bg-primary/10 text-primary font-mono-label text-mono-label cursor-pointer hover:bg-primary/20 transition-colors" type="button">
<span>TailwindCSS</span>
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
<!-- Unselected Chips -->
<button class="skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span>Node.js</span>
</button>
<button class="skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span>Python</span>
</button>
<button class="skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span>Go</span>
</button>
<button class="skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span>PostgreSQL</span>
</button>
<button class="skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span>Docker</span>
</button>
<!-- Add Custom Skill -->
<div class="inline-flex items-center border border-dashed border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-sm">
<input class="bg-transparent border-none w-20 px-xs py-[6px] font-mono-label text-mono-label text-on-surface focus:outline-none focus:ring-0 placeholder:text-on-surface-variant/50" placeholder="Type..." type="text"/>
<span class="material-symbols-outlined text-outline text-[16px] cursor-pointer hover:text-primary transition-colors">keyboard_return</span>
</div>
</div>
</div>
</div>
<!-- Footer / Actions -->
<footer class="p-lg md:p-xl border-t border-surface-variant bg-surface-container flex justify-between items-center mt-auto">
<button class="font-mono-label text-mono-label text-on-surface-variant hover:text-on-surface px-md py-sm rounded transition-colors flex items-center gap-xs group">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_left_alt</span>
                Back
            </button>
<button class="bg-primary-container text-on-primary-container font-mono-label text-mono-label px-xl py-sm rounded-DEFAULT hover:bg-primary transition-colors shadow-[0_0_15px_rgba(16,185,129,0.15)] flex items-center gap-sm group">
                Save &amp; Continue
                <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
</button>
</footer>
</main>
<script>
        // Simple JS to toggle chip visual states for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.skill-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    const isActive = this.classList.contains('active');
                    const textSpan = this.querySelector('span:not(.material-symbols-outlined)');
                    const iconSpan = this.querySelector('.material-symbols-outlined');
                    const skillName = textSpan ? textSpan.textContent : '';

                    if (isActive) {
                        // Deactivate
                        this.className = 'skill-chip inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-mono-label text-mono-label cursor-pointer hover:border-on-surface-variant hover:text-on-surface transition-colors';
                        this.innerHTML = `<span class="material-symbols-outlined text-[14px]">add</span><span>${skillName}</span>`;
                    } else {
                        // Activate
                        this.className = 'skill-chip active inline-flex items-center gap-xs px-md py-[6px] rounded-DEFAULT border border-primary/30 bg-primary/10 text-primary font-mono-label text-mono-label cursor-pointer hover:bg-primary/20 transition-colors';
                        this.innerHTML = `<span>${skillName}</span><span class="material-symbols-outlined text-[14px]">close</span>`;
                    }
                });
            });
        });
    </script>
</body></html>
